[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartoken"
version = "0.1.0"
description = "Task-aware model router for terminal agents: local-first, cost-optimal, auditable."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PySide6>=6.6"]

[project.scripts]
smartoken = "smartoken.cli:main"
smartoken-gui = "smartoken_gui.app:main"

[project.gui-scripts]
smartoken-gui-w = "smartoken_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
